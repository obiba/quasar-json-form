name: Release and Publish to npm

on:
  push:
    tags:
      - 'ui-v*'        # Tag format: ui-v0.0.2
      - 'app-ext-v*'   # Tag format: app-ext-v0.0.2

jobs:
  release-ui:
    if: startsWith(github.ref, 'refs/tags/ui-v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI package
        working-directory: ui
        run: npm run build

      - name: Publish UI package to npm
        working-directory: ui
        run: npm publish --access public

      - name: Create GitHub Release for UI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "UI Package Release $GITHUB_REF_NAME" \
            --notes "$(printf 'Release of @obiba/quasar-ui-json-form\n\nVersion: %s' "$GITHUB_REF_NAME")"

  release-app-extension:
    if: startsWith(github.ref, 'refs/tags/app-ext-v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false  # never use caching in release builds

      - name: Install App Extension dependencies
        working-directory: app-extension
        run: npm ci

      - name: Build App Extension package
        working-directory: app-extension
        run: npm run build --if-present

      - name: Publish App Extension to npm
        working-directory: app-extension
        run: npm publish --access public

      - name: Create GitHub Release for App Extension
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "App Extension Release $GITHUB_REF_NAME" \
            --notes "$(printf 'Release of @obiba/quasar-app-extension-json-form\n\nVersion: %s' "$GITHUB_REF_NAME")"
