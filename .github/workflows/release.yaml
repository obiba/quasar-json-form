name: Release and Publish to npm

on:
  push:
    tags:
      - 'ui-v*'        # Tag format: ui-v0.0.2
      - 'app-ext-v*'   # Tag format: app-ext-v0.0.2

jobs:
  release-ui:
    if: startsWith(github.ref, 'refs/tags/ui-v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI package
        working-directory: ui
        run: npm run build

      - name: Publish UI package to npm
        working-directory: ui
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release for UI
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: UI Package Release ${{ github.ref_name }}
          body: |
            Release of @obiba/quasar-ui-json-form
            
            Version: ${{ github.ref_name }}
          draft: false
          prerelease: false

  release-app-extension:
    if: startsWith(github.ref, 'refs/tags/app-ext-v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
      id-token: write

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          registry-url: 'https://registry.npmjs.org'

      - name: Install App Extension dependencies
        working-directory: app-extension
        run: npm install

      - name: Publish App Extension to npm
        working-directory: app-extension
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release for App Extension
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: App Extension Release ${{ github.ref_name }}
          body: |
            Release of @obiba/quasar-app-extension-json-form
            
            Version: ${{ github.ref_name }}
          draft: false
          prerelease: false
